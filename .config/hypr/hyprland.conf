$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show drun

exec-once = uwsm app -- $terminal
exec-once = uwsm app -- wl-paste --watch cliphist store
#exec-once = ~/.config/hypr/scripts/auto_monitor.sh

#Tienes que desactivar los monitores no sirve no seleccionarlos
monitor=DP-1,1920x1080@60,0x0,1
#monitor=eDP-1,disable
#monitor=hdmi-a-1,1920X1080@60,1920X0,1
#monitor=eDP-1,1366x768@60,1920x0,1
monitor=eDP-1,1920x1080@60,1920x0,1

env= XDG_SESSION_TYPE,wayland
env= XDG_SESSION_DESKTOP,hyprland
env = XDG_MENU_PREFIX,arch-
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 1
    gaps_out = 1
    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = 0xff444444
    col.inactive_border = 0xff444444

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}
ecosystem {
    no_update_news = true
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false
}


# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = stack
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    font_family = Hack Nerd Font
}


input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    float_switch_override_focus = 0 # Solucion problema de foco al mover entre ventanas flotantes y no flotantes

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.7
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Personal
bind = $mainMod SHIFT, SPACE, exec, killall waybar || waybar
bind = $mainMod, V, exec, uwsm app -- sh -c 'cliphist list | wofi --dmenu | cliphist decode | wl-copy'
bind = $mainMod, F, exec, uwsm app -- sh -c 'grim -g "$(slurp)" - | wl-copy --type image/png'

bind = $mainMod, Return, exec, uwsm app -- $terminal
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, M, exec, uwsm stop
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, Q, togglefloating,
bind = $mainMod, SPACE, exec, uwsm app -- $menu
bind = SUPER, D, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, J, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, I, movefocus, u
bind = $mainMod, K, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/switch_ws.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/switch_ws.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/switch_ws.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/switch_ws.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/switch_ws.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/switch_ws.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/switch_ws.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/switch_ws.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/switch_ws.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/switch_ws.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/move_window.sh 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/move_window.sh 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/move_window.sh 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/move_window.sh 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/move_window.sh 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/move_window.sh 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/move_window.sh 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/move_window.sh 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/move_window.sh 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/move_window.sh 10

# Al presionar Super + Control + [1-0]
bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/sync_ws.sh 1
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/sync_ws.sh 2
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/sync_ws.sh 3
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/sync_ws.sh 4
bind = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/sync_ws.sh 5
bind = $mainMod CTRL, 6, exec, ~/.config/hypr/scripts/sync_ws.sh 6
bind = $mainMod CTRL, 7, exec, ~/.config/hypr/scripts/sync_ws.sh 7
bind = $mainMod CTRL, 8, exec, ~/.config/hypr/scripts/sync_ws.sh 8
bind = $mainMod CTRL, 9, exec, ~/.config/hypr/scripts/sync_ws.sh 9
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/sync_ws.sh 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Maestro DP-1
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# Workspaces para el monitor Secundario (eDP-1)
workspace = 11, monitor:eDP-1
workspace = 12, monitor:eDP-1
workspace = 13, monitor:eDP-1
workspace = 14, monitor:eDP-1
workspace = 15, monitor:eDP-1
workspace = 16, monitor:eDP-1
workspace = 17, monitor:eDP-1
workspace = 18, monitor:eDP-1
workspace = 19, monitor:eDP-1
workspace = 20, monitor:eDP-1
